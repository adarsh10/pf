<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Open an experiment — AI play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="ai-play.css" />
  <script src="play.js" defer></script>
</head>
<body class="app-shell">
  <header class="app-header">
    <a id="back-to-project" href="ai-play.html">← AI play</a>
    <div><span class="app-overline">Independent experiment / Adarsh Raj Shah</span><h1 id="app-title">Choose an experiment</h1></div>
    <a id="open-direct" href="ai-play.html" target="_blank" rel="noopener" hidden>Open full window ↗</a>
  </header>
  <main class="app-stage" id="main">
    <section class="launch-panel" id="launch-panel">
      <span class="eyebrow">A working prototype, not a product launch</span>
      <h2 id="launch-title">This experiment wasn't found.</h2>
      <p id="launch-description">Choose one of the four projects in AI play.</p>
      <p class="launch-note" id="launch-note" hidden></p>
      <button class="btn btn-primary" id="launch-button" hidden>Launch experiment ↗</button>
      <noscript><p>JavaScript is required for these interactive projects. You can still read their descriptions on the <a href="ai-play.html">AI play page</a>.</p></noscript>
    </section>
    <p class="app-loading" id="app-loading" role="status" hidden>Loading the experiment… You can also open it in a full window.</p>
  </main>
</body>
</html>
